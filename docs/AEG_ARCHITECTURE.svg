<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Zero-Trust Agent Effect Gateway architecture</title>
  <desc id="desc">One-page architecture showing pluggable identity, effect enforcement and observable evidence around an untrusted Codex Runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#151d34"/></linearGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17233f"/><stop offset="1" stop-color="#111a30"/></linearGradient>
    <linearGradient id="untrusted" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30213c"/><stop offset="1" stop-color="#21182f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02040a" flood-opacity="0.4"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#87a7ff"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#63d7aa"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff7d8f"/></marker>
    <style>
      .title{font:700 34px Inter,system-ui,sans-serif;fill:#f7f9ff;letter-spacing:-.5px}.subtitle{font:400 15px Inter,system-ui,sans-serif;fill:#9eabc7}.zone{font:700 13px Inter,system-ui,sans-serif;letter-spacing:1.6px}.nodeTitle{font:700 16px Inter,system-ui,sans-serif;fill:#f8f9ff}.nodeBody{font:400 12px Inter,system-ui,sans-serif;fill:#aeb9d1}.small{font:600 11px Inter,system-ui,sans-serif;fill:#8fa0bf;letter-spacing:.4px}.flow{fill:none;stroke:#87a7ff;stroke-width:2.4;marker-end:url(#arrow)}.allow{fill:none;stroke:#63d7aa;stroke-width:2.4;marker-end:url(#arrowGreen)}.deny{fill:none;stroke:#ff7d8f;stroke-width:2.4;marker-end:url(#arrowRed)}.evidence{fill:none;stroke:#b593ff;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1440" cy="80" r="230" fill="#6c54d9" opacity=".08"/><circle cx="180" cy="820" r="270" fill="#2ebd8c" opacity=".05"/>
  <text x="60" y="62" class="title">Zero-Trust Agent Effect Gateway</text><text x="60" y="91" class="subtitle">Pluggable identity · effect enforcement · continuous security observability</text>

  <rect x="55" y="128" width="250" height="622" rx="22" fill="#121a2d" stroke="#34415c"/><text x="80" y="159" class="zone" fill="#87a7ff">HUMAN INTERACTION</text>
  <g filter="url(#shadow)"><rect x="82" y="205" width="196" height="94" rx="16" fill="#1a2743" stroke="#4c628a"/><text x="104" y="239" class="nodeTitle">Human</text><text x="104" y="263" class="nodeBody">Task intent · approval · stop</text></g>
  <g filter="url(#shadow)"><rect x="82" y="345" width="196" height="128" rx="16" fill="#1a2743" stroke="#4c628a"/><text x="104" y="379" class="nodeTitle">React UI</text><text x="104" y="403" class="nodeBody">Playground safety notices</text><text x="104" y="424" class="nodeBody">Security Center trace</text><text x="104" y="445" class="nodeBody">Approval + evidence inspector</text></g><path d="M180 299 L180 345" class="flow"/>

  <rect x="345" y="128" width="790" height="622" rx="22" fill="url(#trusted)" stroke="#46608f" stroke-width="1.5"/><text x="370" y="159" class="zone" fill="#63d7aa">TRUSTED CONTROL PLANE</text>
  <g filter="url(#shadow)"><rect x="380" y="194" width="205" height="100" rx="16" fill="#192844" stroke="#3e5b86"/><text x="402" y="227" class="nodeTitle">Identity + Delegation</text><text x="402" y="251" class="nodeBody">Human · Agent principal</text><text x="402" y="272" class="nodeBody">Run capability · revoke</text></g>
  <g filter="url(#shadow)"><rect x="635" y="194" width="205" height="100" rx="16" fill="#192844" stroke="#3e5b86"/><text x="657" y="227" class="nodeTitle">Stager</text><text x="657" y="251" class="nodeBody">Workspace + Codex Home</text><text x="657" y="272" class="nodeBody">baseline SHA-256 check</text></g>
  <g filter="url(#shadow)"><rect x="890" y="194" width="205" height="100" rx="16" fill="#192844" stroke="#3e5b86"/><text x="912" y="227" class="nodeTitle">Effect Collectors</text><text x="912" y="251" class="nodeBody">Tree diff + HTTP outbox</text><text x="912" y="272" class="nodeBody">combined manifest + digest</text></g>
  <g filter="url(#shadow)"><rect x="505" y="365" width="220" height="112" rx="16" fill="#1b3041" stroke="#3c826e"/><text x="528" y="399" class="nodeTitle">Module Registry</text><text x="528" y="423" class="nodeBody">Typed hooks · policy modules</text><text x="528" y="444" class="nodeBody">Most restrictive decision wins</text></g>
  <g filter="url(#shadow)"><rect x="770" y="365" width="220" height="112" rx="16" fill="#382d1f" stroke="#9a762e"/><text x="793" y="399" class="nodeTitle">Approval Manager</text><text x="793" y="423" class="nodeBody">Digest · policy version · TTL</text><text x="793" y="444" class="nodeBody">revalidate before commit</text></g>
  <g filter="url(#shadow)"><rect x="505" y="548" width="220" height="118" rx="16" fill="#18352f" stroke="#3a9676"/><text x="528" y="582" class="nodeTitle">Trusted Executors</text><text x="528" y="606" class="nodeBody">Filesystem commit / HTTP send</text><text x="528" y="627" class="nodeBody">verify · idempotency · receipt</text></g>
  <g filter="url(#shadow)"><rect x="770" y="548" width="220" height="118" rx="16" fill="#361f2b" stroke="#99546b"/><text x="793" y="582" class="nodeTitle">Rollback</text><text x="793" y="606" class="nodeBody">Discard staging</text><text x="793" y="627" class="nodeBody">restore snapshot exactly</text></g>
  <rect x="380" y="690" width="715" height="40" rx="12" fill="#181d36" stroke="#675493"/><text x="400" y="715" class="small">EVENT BUS → HMAC LEDGER → QUERY API · HUMAN → AGENT → RUN → EFFECT</text>
  <path d="M278 409 L380 244" class="flow"/><path d="M585 244 L635 244" class="flow"/><path d="M890 274 C810 330 700 323 650 365" class="flow"/><path d="M725 421 L770 421" class="flow"/><text x="735" y="407" class="small">review</text><path d="M615 477 L615 548" class="allow"/><text x="625" y="518" class="small" fill="#63d7aa">allow</text><path d="M880 477 C880 510 780 510 725 579" class="allow"/><path d="M670 477 C710 512 815 510 855 548" class="deny"/><text x="748" y="513" class="small" fill="#ff7d8f">deny / expire / mismatch</text>

  <rect x="1175" y="128" width="370" height="622" rx="22" fill="url(#untrusted)" stroke="#744e80" stroke-width="1.5"/><text x="1200" y="159" class="zone" fill="#d6a4ec">UNTRUSTED EXECUTION DOMAIN</text>
  <g filter="url(#shadow)"><rect x="1210" y="205" width="300" height="116" rx="16" fill="#33233f" stroke="#79578a"/><text x="1234" y="240" class="nodeTitle">Disposable Staging</text><text x="1234" y="264" class="nodeBody">Workspace copy · Codex Home copy</text><text x="1234" y="285" class="nodeBody">real paths never mounted</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="371" width="300" height="126" rx="16" fill="#3a2544" stroke="#8b5e9b"/><text x="1234" y="406" class="nodeTitle">Codex Runtime</text><text x="1234" y="430" class="nodeBody">LLM · commands · generated code</text><text x="1234" y="451" class="nodeBody">all outputs treated as untrusted</text><text x="1234" y="472" class="nodeBody">Ark key present during active Run</text></g>
  <rect x="1210" y="548" width="300" height="86" rx="16" fill="#281e3b" stroke="#725aa0"/><text x="1234" y="581" class="nodeTitle">Self-reported Trace</text><text x="1234" y="605" class="nodeBody">Evidence only · compared with diff</text>
  <rect x="1210" y="672" width="300" height="58" rx="14" fill="#3c202a" stroke="#a55265"/><text x="1234" y="697" class="nodeTitle">Ark + External Services</text><text x="1234" y="716" class="nodeBody">AEG HTTP path · Runtime egress still open</text>
  <path d="M840 232 C1020 160 1135 190 1210 245" class="flow"/><path d="M1360 321 L1360 371" class="flow"/><path d="M1210 434 C1115 434 1100 300 1045 294" class="flow"/><path d="M1360 497 L1360 548" class="evidence"/><path d="M1360 497 L1360 672" class="deny"/><path d="M725 607 C940 650 1070 700 1210 701" class="allow"/>

  <rect x="55" y="783" width="1490" height="73" rx="18" fill="#10182a" stroke="#2b3852"/><text x="80" y="812" class="zone" fill="#63d7aa">PROTECTED EFFECTS</text><text x="80" y="839" class="nodeBody">Real workspace + committed session + declared HTTP actions pass trusted executors</text><text x="900" y="812" class="zone" fill="#ff9bac">DECLARED LIMITS</text><text x="900" y="839" class="nodeBody">Universal egress interception · host admin trust · single process · remote compensation</text><path d="M615 666 L615 783" class="allow"/>
</svg>
